name: Build Phakisa Rides ZA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          flutter --version
          flutter pub get

      - name: Check Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk phakisa-rides-za.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phakisa-rides-za-android
          path: phakisa-rides-za.apk
          if-no-files-found: error
